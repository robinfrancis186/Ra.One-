<title>Ra.One: Lucifer Protocol</title>
<style>
/* RA.ONE — LUCIFER PROTOCOL : cabinet shell */
:root {
  --hart: #38d8ff;
  --ra: #ff2f45;
  --ink: #05060b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #000;
  color: #c8d4e6;
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
#cabinet {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 50% 40%, #101a2c 0%, #05060b 55%, #000 100%);
}
#stage {
  position: relative;
  width: min(100vw, 177.78vh);
  height: min(100vh, 56.25vw);
  display: flex; align-items: center; justify-content: center;
}
#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #05060b;
  border-radius: 4px;
  box-shadow:
    0 0 0 2px #0d1626,
    0 0 0 6px #060a12,
    0 0 40px rgba(56, 216, 255, 0.12),
    0 0 120px rgba(255, 47, 69, 0.06);
}
/* CRT overlays sit on top of the canvas, never in the render loop */
#scanlines, #vignette, #glare {
  position: absolute; inset: 0; pointer-events: none; border-radius: 4px;
}
#scanlines {
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.00) 0px,
    rgba(0, 0, 0, 0.00) 2px,
    rgba(0, 0, 0, 0.22) 3px,
    rgba(0, 0, 0, 0.22) 4px
  );
  mix-blend-mode: multiply;
}
#vignette {
  background: radial-gradient(ellipse at center,
    rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}
#glare {
  background: linear-gradient(120deg,
    rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 32%);
}
#hint {
  position: fixed; left: 0; right: 0; bottom: 4px;
  margin: 0; text-align: center;
  font-size: 10px; letter-spacing: 1px;
  color: #46617f; text-shadow: 0 1px 3px #000;
  transition: opacity 700ms ease;
  pointer-events: none;
}
#hint.gone { opacity: 0; }
/* touch controls — only shown on touch devices */
#touchpad {
  position: fixed; inset: auto 0 0 0; height: 40vh;
  display: none; justify-content: space-between; align-items: flex-end;
  padding: 12px; pointer-events: none;
}
#touchpad .cluster { display: flex; gap: 10px; pointer-events: auto; }
#touchpad .col { display: flex; flex-direction: column; gap: 10px; }
#touchpad button {
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(20, 32, 52, 0.65);
  border: 2px solid rgba(56, 216, 255, 0.45);
  color: #c8d4e6; font: bold 12px "Courier New", monospace;
  touch-action: none; user-select: none;
}
#touchpad button.on { background: rgba(56, 216, 255, 0.35); }
#touchpad button.wide { width: 74px; }

</style>

<div id="cabinet">
    <div id="stage">
      <canvas id="screen" width="640" height="360"></canvas>
      <div id="scanlines"></div>
      <div id="vignette"></div>
      <div id="glare"></div>
    </div>
  </div>

  <p id="hint">CLICK THE SCREEN, THEN PRESS ANY KEY &nbsp;·&nbsp; ARROWS MOVE &nbsp;·&nbsp; Z JUMP &nbsp;·&nbsp; X HIT &nbsp;·&nbsp; C BLAST &nbsp;·&nbsp; H DETACH H.A.R.T.</p>

  <div id="touchpad">
    <div class="cluster">
      <button data-act="left">&#9664;</button>
      <button data-act="right">&#9654;</button>
    </div>
    <div class="cluster">
      <div class="col">
        <button data-act="hart">H</button>
        <button data-act="dash">DSH</button>
      </div>
      <div class="col">
        <button data-act="blast">BLST</button>
        <button data-act="hit">HIT</button>
      </div>
      <div class="col">
        <button data-act="start" class="wide">ENT</button>
        <button data-act="jump" class="wide">JUMP</button>
      </div>
    </div>
  </div>

  <script>
    // the hint is for the first ten seconds, not for the whole game
    (function () {
      function drop() {
        var h = document.getElementById('hint');
        if (h) h.classList.add('gone');
        window.removeEventListener('keydown', drop);
        window.removeEventListener('pointerdown', drop);
      }
      window.addEventListener('keydown', drop);
      window.addEventListener('pointerdown', drop);
      setTimeout(drop, 12000);
    })();
  </script>

<script>
/* ===== src/engine/core.js ===== */
/* =============================================================
   RA.ONE — LUCIFER PROTOCOL
   engine/core.js — maths, palette, renderer, particles, camera
   ============================================================= */
(function (global) {
  'use strict';

  var VIEW_W = 640, VIEW_H = 360, TILE = 16;

  /* ---------- maths ---------- */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function approach(v, target, step) {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return v;
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  /* ---------- palette ----------
     Movie-derived: G.One is white/graphite with cyan H.A.R.T. light,
     Ra.One is black/graphite with hot white-blue seams and red scan-eyes. */
  var PAL = {
    void:      '#05060b',
    deep:      '#0a0f1c',
    grid:      '#12203a',
    steel:     '#28374f',
    steelLite: '#42556f',
    white:     '#eef4ff',
    bone:      '#c8d4e6',
    hart:      '#38d8ff',
    hartDeep:  '#0b7fb5',
    hartGlow:  '#a8f2ff',
    ra:        '#1e232e',
    raSeam:    '#dfe9ff',
    raRed:     '#ff2f45',
    amber:     '#ffb400',
    gold:      '#ffdf5a',
    saffron:   '#ff7a1a',
    green:     '#3ef08a',
    magenta:   '#ff3fd0',
    shadow:    'rgba(0,0,0,0.45)'
  };

  /* ---------- renderer ---------- */
  var Gfx = {
    canvas: null, ctx: null,
    shakeT: 0, shakeMag: 0, shakeX: 0, shakeY: 0,
    flashT: 0, flashColor: '#ffffff', flashAlpha: 0,

    init: function (canvas) {
      this.canvas = canvas;
      canvas.width = VIEW_W; canvas.height = VIEW_H;
      this.ctx = canvas.getContext('2d');
      this.ctx.imageSmoothingEnabled = false;
      this.initPost();
      this.resize();
      global.addEventListener('resize', this.resize.bind(this));
      return this;
    },

    /* ---------- post-processing ----------
       A bright-pass + blur composited back additively. Every glow, every
       neon edge, every muzzle flash gets real bloom out of it, which is
       most of the difference between "shapes on a background" and "light". */
    initPost: function () {
      this.postOn = true;
      this.bloomScale = 3;
      var bw = Math.ceil(VIEW_W / this.bloomScale), bh = Math.ceil(VIEW_H / this.bloomScale);
      this.bloomCv = document.createElement('canvas');
      this.bloomCv.width = bw; this.bloomCv.height = bh;
      this.bloomCtx = this.bloomCv.getContext('2d');
      this.bloomAmt = 0.45;

      // one tile of static, shifted every frame — analog noise for free
      var g = document.createElement('canvas');
      g.width = 128; g.height = 128;
      var gc = g.getContext('2d');
      var img = gc.createImageData(128, 128), d = img.data;
      for (var i = 0; i < 128 * 128; i++) {
        var v = Math.random() * 255;
        d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
        d[i * 4 + 3] = 14;
      }
      gc.putImageData(img, 0, 0);
      this.grainCv = g;
    },

    post: function () {
      if (!this.postOn || this.postDone) return;
      this.postDone = true;
      var c = this.ctx, b = this.bloomCtx;
      var bw = this.bloomCv.width, bh = this.bloomCv.height;
      try {
        b.setTransform(1, 0, 0, 1, 0, 0);
        b.globalCompositeOperation = 'source-over';
        b.clearRect(0, 0, bw, bh);
        b.filter = 'brightness(1.05) contrast(3.4) blur(2px)';
        b.drawImage(this.canvas, 0, 0, bw, bh);
        b.filter = 'none';
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = this.bloomAmt;
        c.imageSmoothingEnabled = true;
        c.drawImage(this.bloomCv, 0, 0, VIEW_W, VIEW_H);
        c.imageSmoothingEnabled = false;
        c.restore();
      } catch (e) { this.postOn = false; }

      // grain, drifting so it never looks like a stuck texture
      c.save();
      c.globalAlpha = 0.34;
      var ox = -Math.floor(Math.random() * 128), oy = -Math.floor(Math.random() * 128);
      for (var x = ox; x < VIEW_W; x += 128) {
        for (var y = oy; y < VIEW_H; y += 128) c.drawImage(this.grainCv, x, y);
      }
      c.restore();
    },

    resize: function () {
      var wrap = this.canvas.parentElement;
      if (!wrap) return;
      var aw = wrap.clientWidth || VIEW_W, ah = wrap.clientHeight || VIEW_H;
      var scale = Math.min(aw / VIEW_W, ah / VIEW_H);
      if (scale > 1) scale = Math.max(1, Math.floor(scale * 2) / 2); // half-steps keep it crisp
      this.canvas.style.width = Math.round(VIEW_W * scale) + 'px';
      this.canvas.style.height = Math.round(VIEW_H * scale) + 'px';
    },

    shake: function (mag, time) {
      if (mag > this.shakeMag || this.shakeT <= 0) { this.shakeMag = mag; this.shakeT = time; }
    },
    flash: function (color, alpha, time) {
      this.flashColor = color; this.flashAlpha = alpha; this.flashT = time;
    },
    updateFx: function (dt) {
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        var f = Math.max(0, this.shakeT);
        this.shakeX = rand(-1, 1) * this.shakeMag * f;
        this.shakeY = rand(-1, 1) * this.shakeMag * f;
        if (this.shakeT <= 0) { this.shakeX = this.shakeY = 0; this.shakeMag = 0; }
      }
      if (this.flashT > 0) this.flashT -= dt;
    },

    begin: function () {
      var c = this.ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = PAL.void;
      c.fillRect(0, 0, VIEW_W, VIEW_H);
      this.postDone = false;
      c.translate(Math.round(this.shakeX), Math.round(this.shakeY));
    },
    end: function () {
      var c = this.ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      this.post();
      if (this.flashT > 0) {
        c.globalAlpha = clamp(this.flashAlpha * this.flashT * 6, 0, 1);
        c.fillStyle = this.flashColor;
        c.fillRect(0, 0, VIEW_W, VIEW_H);
        c.globalAlpha = 1;
      }
    },

    /* primitives */
    rect: function (x, y, w, h, color) {
      var c = this.ctx; c.fillStyle = color;
      c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    },
    rectA: function (x, y, w, h, color, alpha) {
      var c = this.ctx; c.globalAlpha = alpha; this.rect(x, y, w, h, color); c.globalAlpha = 1;
    },
    line: function (x1, y1, x2, y2, color, w) {
      var c = this.ctx;
      c.strokeStyle = color; c.lineWidth = w || 1;
      c.beginPath(); c.moveTo(x1 + 0.5, y1 + 0.5); c.lineTo(x2 + 0.5, y2 + 0.5); c.stroke();
    },
    circle: function (x, y, r, color) {
      var c = this.ctx; c.fillStyle = color;
      c.beginPath(); c.arc(Math.round(x), Math.round(y), r, 0, Math.PI * 2); c.fill();
    },
    ring: function (x, y, r, color, w, alpha) {
      var c = this.ctx;
      c.globalAlpha = alpha === undefined ? 1 : alpha;
      c.strokeStyle = color; c.lineWidth = w || 1;
      c.beginPath(); c.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    },
    /* soft additive bloom — the H.A.R.T. glow */
    glow: function (x, y, r, color, alpha) {
      var c = this.ctx;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = alpha === undefined ? 0.5 : alpha;
      var g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      c.restore();
    },

    /* text — chunky monospace, drawn into the low-res buffer so it pixel-scales */
    text: function (str, x, y, opt) {
      opt = opt || {};
      var c = this.ctx;
      var size = opt.size || 8;
      c.font = (opt.bold === false ? '' : 'bold ') + size + 'px "Courier New", ui-monospace, monospace';
      c.textAlign = opt.align || 'left';
      c.textBaseline = 'top';
      if (opt.shadow !== false) {
        c.fillStyle = opt.shadowColor || 'rgba(0,0,0,0.85)';
        c.fillText(str, Math.round(x) + 1, Math.round(y) + 1);
      }
      if (opt.glow) { c.save(); c.shadowColor = opt.glow; c.shadowBlur = 8; }
      c.fillStyle = opt.color || PAL.white;
      c.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
      c.fillText(str, Math.round(x), Math.round(y));
      c.globalAlpha = 1;
      if (opt.glow) c.restore();
    },
    textWidth: function (str, size) {
      var c = this.ctx;
      c.font = 'bold ' + (size || 8) + 'px "Courier New", ui-monospace, monospace';
      return c.measureText(str).width;
    },
    /* word-wrap helper for the codex */
    wrap: function (str, size, maxW) {
      var words = String(str).split(' '), lines = [], cur = '';
      for (var i = 0; i < words.length; i++) {
        var t = cur ? cur + ' ' + words[i] : words[i];
        if (this.textWidth(t, size) > maxW && cur) { lines.push(cur); cur = words[i]; }
        else cur = t;
      }
      if (cur) lines.push(cur);
      return lines;
    }
  };

  /* ---------- particles ---------- */
  function Particles() { this.list = []; }
  Particles.prototype.spawn = function (o) {
    this.list.push({
      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 0.5, max: o.life || 0.5,
      size: o.size || 2, color: o.color || PAL.hart,
      grav: o.grav === undefined ? 0.1 : o.grav,
      drag: o.drag === undefined ? 1 : o.drag,
      glow: !!o.glow, ring: !!o.ring, spin: o.spin || 0
    });
  };
  Particles.prototype.burst = function (x, y, n, o) {
    o = o || {};
    for (var i = 0; i < n; i++) {
      var a = o.angle === undefined ? rand(0, Math.PI * 2) : o.angle + rand(-o.spread || -0.6, o.spread || 0.6);
      var s = rand(o.smin === undefined ? 0.6 : o.smin, o.smax === undefined ? 3 : o.smax);
      this.spawn({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(o.lmin || 0.25, o.lmax || 0.7), size: o.size || randInt(1, 3),
        color: o.color || PAL.hart, grav: o.grav, drag: o.drag, glow: o.glow
      });
    }
  };
  Particles.prototype.update = function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += p.grav; p.vx *= p.drag; p.vy *= p.drag;
      p.life -= dt;
      if (p.life <= 0) this.list.splice(i, 1);
    }
  };
  Particles.prototype.draw = function (cam) {
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i], t = clamp(p.life / p.max, 0, 1);
      var x = p.x - cam.x, y = p.y - cam.y;
      if (p.glow) Gfx.glow(x, y, p.size * 3, p.color, 0.35 * t);
      Gfx.rectA(x - p.size / 2, y - p.size / 2, p.size, p.size, p.color, t);
    }
  };
  Particles.prototype.clear = function () { this.list.length = 0; };

  /* ---------- camera ---------- */
  function Camera(w, h) {
    this.x = 0; this.y = 0; this.w = w; this.h = h;
    this.boundsW = w; this.boundsH = h; this.lockX = false;
  }
  Camera.prototype.follow = function (target, snap) {
    if (this.lockX) return;
    var tx = clamp(target.x + target.w / 2 - this.w / 2, 0, Math.max(0, this.boundsW - this.w));
    var ty = clamp(target.y + target.h / 2 - this.h / 2 + 20, 0, Math.max(0, this.boundsH - this.h));
    if (snap) { this.x = tx; this.y = ty; }
    else { this.x = lerp(this.x, tx, 0.12); this.y = lerp(this.y, ty, 0.08); }
  };
  Camera.prototype.clampX = function () {
    this.x = clamp(this.x, 0, Math.max(0, this.boundsW - this.w));
  };

  global.RA = global.RA || {};
  global.RA.core = {
    VIEW_W: VIEW_W, VIEW_H: VIEW_H, TILE: TILE,
    PAL: PAL, Gfx: Gfx, Particles: Particles, Camera: Camera,
    clamp: clamp, lerp: lerp, approach: approach, rand: rand, randInt: randInt,
    pick: pick, aabb: aabb, dist: dist
  };
})(window);

/* ===== src/engine/input.js ===== */
/* =============================================================
   engine/input.js — keyboard + touch, action-mapped
   ============================================================= */
(function (global) {
  'use strict';

  var MAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump',
    KeyX: 'hit', KeyJ: 'hit',
    KeyC: 'blast', KeyK: 'blast',
    ShiftLeft: 'dash', ShiftRight: 'dash', KeyL: 'dash',
    KeyH: 'hart',
    Enter: 'start', NumpadEnter: 'start',
    Escape: 'pause', KeyP: 'pause',
    Tab: 'codex',
    KeyM: 'mute'
  };

  var Input = {
    state: {}, last: {}, latch: {}, anyPressed: false, touch: false,
    buttons: [],

    init: function (canvas) {
      var self = this;
      global.addEventListener('keydown', function (e) {
        var a = MAP[e.code];
        if (a) {
          e.preventDefault();
          self.state[a] = true;
          if (!e.repeat) self.latch[a] = true;   // latch, so a 1ms tap is never lost
          self.anyPressed = true;
        }
        // free typing for the player-name entry
        self.lastKey = e.key;
        self.lastCode = e.code;
      });
      global.addEventListener('keyup', function (e) {
        var a = MAP[e.code];
        if (a) { e.preventDefault(); self.state[a] = false; }
      });
      global.addEventListener('blur', function () { self.state = {}; self.latch = {}; });
      this.initTouch(canvas);
      return this;
    },

    /* on-screen controls appear only if the device reports touch */
    initTouch: function (canvas) {
      if (!('ontouchstart' in global) && !navigator.maxTouchPoints) return;
      this.touch = true;
      var pad = document.getElementById('touchpad');
      if (!pad) return;
      pad.style.display = 'flex';
      var self = this;
      var els = pad.querySelectorAll('[data-act]');
      for (var i = 0; i < els.length; i++) {
        (function (el) {
          var act = el.getAttribute('data-act');
          function on(e) {
            e.preventDefault();
            self.state[act] = true; self.latch[act] = true;
            self.anyPressed = true; el.classList.add('on');
          }
          function off(e) { e.preventDefault(); self.state[act] = false; el.classList.remove('on'); }
          el.addEventListener('touchstart', on, { passive: false });
          el.addEventListener('touchend', off, { passive: false });
          el.addEventListener('touchcancel', off, { passive: false });
          el.addEventListener('mousedown', on);
          el.addEventListener('mouseup', off);
          el.addEventListener('mouseleave', off);
        })(els[i]);
      }
    },

    down: function (a) { return !!this.state[a]; },
    /* consumes the latch: one press == one trigger, however short the tap */
    pressed: function (a) {
      if (this.latch[a]) { this.latch[a] = false; return true; }
      return false;
    },
    released: function (a) { return !this.state[a] && !!this.last[a]; },
    anyStart: function () {
      return this.pressed('start') || this.pressed('jump') || this.pressed('hit');
    },
    endFrame: function () {
      this.last = {};
      for (var k in this.state) this.last[k] = this.state[k];
      this.latch = {};
      this.anyPressed = false;
      this.lastKey = null; this.lastCode = null;
    }
  };

  global.RA = global.RA || {};
  global.RA.Input = Input;
})(window);

/* ===== src/engine/audio.js ===== */
/* =============================================================
   engine/audio.js — original chiptune + SFX, pure WebAudio.
   Melodies are written in a Phrygian-dominant (Bhairav-flavoured)
   scale: original music, but with an unmistakably filmi colour.
   Nothing here is sampled or transcribed from the soundtrack.
   ============================================================= */
(function (global) {
  'use strict';

  var SCALE = [0, 1, 4, 5, 7, 8, 11];           // 1 b2 3 4 5 b6 7
  function deg(d) {                              // scale degree -> semitones
    var oct = Math.floor(d / 7), i = ((d % 7) + 7) % 7;
    return SCALE[i] + 12 * oct;
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  var A = {
    ctx: null, master: null, musicGain: null, sfxGain: null,
    muted: false, track: null, step: 0, nextTime: 0, timer: null, ready: false,

    init: function () {
      if (this.ctx) return this;
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return this;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;

      torso: paint(ART[def.torso], pal),
      upperArm: paint(ART.upperArm, pal),

      upperArm: paint(ART.upperArm, palBack),

      return;

    if (this.phase === 'out') {

    if (this.pt > 7.5) { this.phase = 'out'; this.pt = 0; return; }
    this.vy = Math.min(this.vy + 0.46, 12);

      this.actT -= dt;
      this.vx = this.face * 5.6;
      if (this.actT <= 0 || this.hitWall) { this.act = null; this.hitWall = false; this.cool = 1.1; }

  function bossPose(b) {
    if (b.aiming) return ['aim', 0];
    if (b.act === 'charge' || b.act === 'rush') return ['run', Math.floor(b.anim)];
    if (b.act) return ['cast', b.actT > 0.2 ? 0 : 1];
    if (b.hurtT > 0.06) return ['hurt', 0];
    if (!b.onGround) return [b.vy < 0 ? 'jump' : 'fall', 0];
    if (Math.abs(b.vx) > 0.5) return ['run', Math.floor(b.anim)];
    return ['idle', Math.floor(b.anim * 0.35)];
  }

  function drawRa(cxp, feetY, o) {
    o = o || {};
    var sheet = o.sheet || ent.sheets().raone;
    var sc = o.scale || RA_SCALE;
    var a = (o.alpha === undefined ? 1 : o.alpha);
    var top = feetY - 34 * sc;

    // the dark he carries with him
    Gfx.glow(cxp, feetY - 20 * sc, 34 * sc, '#000000', 0.5 * a);

    if (o.trail) {
      for (var k = 1; k <= 3; k++) {
        global.RA.spr.draw(sheet, o.anim, o.frame, cxp - (o.face || 1) * k * 7, feetY,
          o.face || 1, { alpha: 0.13 * (4 - k) * a, scale: sc });
      }
    }
    global.RA.spr.draw(sheet, o.anim || 'idle', o.frame || 0, cxp, feetY, o.face || 1,
      { alpha: o.alpha, scale: sc, flash: o.hurt ? '#ffffff' : null });

    if (o.dim !== true) {
      Gfx.glow(cxp, top + 6 * sc, 10, o.eye || PAL.raRed, 0.55 * a);   // the scan band
      Gfx.glow(cxp, top + 16 * sc, 13, o.eye || PAL.raRed, 0.35 * a);  // the core
    }
  }

  /* ================= BASE ================= */
  function Boss(x, y, level, game) {
    this.x = x; this.y = y; this.w = 22; this.h = 40;
    this.vx = 0; this.vy = 0; this.face = -1;
    this.anim = 0; this.hurtT = 0; this.phase = 1; this.t = 0;
    this.state = 'idle'; this.dead = false; this.remove = false;
    this.onGround = false; this.game = game; this.level = level;
    this.cool = 1.2; this.actT = 0; this.act = null;
    this.intro = 2.0; this.contact = 12; this.invulnLabel = null;
    this.hp = this.maxhp = 200;
    this.name = 'RA.ONE';
  }
  Boss.prototype.cx = function () { return this.x + this.w / 2; };
  Boss.prototype.cy = function () { return this.y + this.h / 2; };
  Boss.prototype.physics = function (world) {
    this.vy = Math.min(this.vy + 0.46, 13);
    this.onGround = false;
    world.move(this, this.vx, this.vy);
  };
  Boss.prototype.damage = function (n, world, kx, kind) {
    if (this.dead || this.immune) {
      if (this.immune) {
        world.parts.burst(this.cx(), this.cy(), 6, { color: PAL.steelLite, smax: 2, lmax: 0.3 });
        this.onImmuneHit && this.onImmuneHit(n, kind, world);
      }
      return false;
    }
    var mult = this.damageMult ? this.damageMult(kind) : 1;
    this.hp -= n * mult;
    this.hurtT = 0.14;
    Audio.sfx('hitflesh');
    world.parts.burst(this.cx(), this.cy(), 10, { color: PAL.raSeam, glow: true, smax: 3 });
    if (mult < 1) {
      world.parts.burst(this.cx(), this.cy(), 6, { color: PAL.steelLite, smax: 2 });
      if (this.game) this.game.toast('BLOCKED', PAL.steelLite);
    }
    if (this.hp <= 0) this.kill(world);
    return true;
  };
  Boss.prototype.kill = function (world) {
    this.hp = 0; this.dead = true;
    Audio.sfx('explode'); Audio.sfx('bossroar');
    Gfx.shake(6, 0.8); Gfx.flash('#ffffff', 0.6, 0.5);
    world.parts.burst(this.cx(), this.cy(), 60, { color: PAL.raSeam, glow: true, smax: 5, lmax: 1.4 });
    world.parts.burst(this.cx(), this.cy(), 30, { color: PAL.raRed, glow: true, smax: 4, lmax: 1.0 });
    if (this.game) this.game.addScore(5000);
  };
  Boss.prototype.hitboxes = function () { return []; };

  /* ================= RA.ONE v1.0 ================= */
  function RaOne1(x, y, level, game) {
    Boss.call(this, x, y, level, game);
    this.hp = this.maxhp = 240;
    this.name = 'RA.ONE v1.0';
    this.sub = 'RANDOM ACCESS VERSION 1.0';
  }
  RaOne1.prototype = Object.create(Boss.prototype);
  RaOne1.prototype.update = function (dt, world, player) {
    this.t += dt; this.anim += dt * 8;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.intro > 0) { this.intro -= dt; this.physics(world); return; }

    var dx = player.cx() - this.cx(), adx = Math.abs(dx);
    this.face = dx > 0 ? 1 : -1;
    var enraged = this.hp < this.maxhp * 0.5;

    if (this.act) {
      this.actT -= dt;
      switch (this.act) {
        case 'charge':
          this.vx = this.face * (enraged ? 6.4 : 5.2);
          this.state = 'run';
          world.parts.spawn({ x: this.cx(), y: this.cy(), vx: 0, vy: 0, life: 0.3,
            size: 3, color: PAL.raRed, glow: true, grav: 0 });
          if (this.hitWall) { this.actT = 0; this.hitWall = false; Gfx.shake(3, 0.2); }
          break;
        case 'slam':
          this.state = 'attack';
          if (this.actT <= 0 && this.onGround) this.shockwave(world, player);
          break;
        case 'volley':
          this.state = 'attack';
          if (this.actT <= 0) this.volley(world, player, enraged ? 5 : 3);
          break;
      }
      if (this.actT <= 0) {
        if (this.act === 'slam' && !this.onGround) { /* wait for landing */ }
        else { this.act = null; this.cool = enraged ? 0.55 : 0.95; }
      }
    } else {
      this.state = Math.abs(this.vx) > 0.4 ? 'run' : 'idle';
      this.vx = C.approach(this.vx, adx > 60 ? this.face * 1.5 : -this.face * 0.9, 0.24);
      this.cool -= dt;
      if (this.cool <= 0) {
        var r = Math.random();
        if (adx < 90 && r < 0.4) { this.act = 'slam'; this.actT = 0.5; this.vy = -7.5; }
        else if (r < 0.75) { this.act = 'charge'; this.actT = enraged ? 0.75 : 0.6; Audio.sfx('bossroar'); }
        else { this.act = 'volley'; this.actT = 0.45; }
      }
    }
    this.physics(world);
    if (this.onGround && !this.act) this.vx *= 0.9;
  };
  RaOne1.prototype.shockwave = function (world, player) {
    Gfx.shake(5, 0.35); Audio.sfx('explode');
    world.parts.burst(this.cx(), this.y + this.h, 26,
      { color: PAL.raRed, glow: true, angle: -Math.PI / 2, spread: 1.4, smax: 5 });
    for (var s = -1; s <= 1; s += 2) {
      world.spawnShot({ x: this.cx(), y: this.y + this.h - 8, vx: s * 4.2, vy: 0,
        w: 10, h: 8, dmg: 14, owner: 'enemy', color: PAL.raRed, life: 1.3 });
    }
  };
  RaOne1.prototype.volley = function (world, player, n) {
    Audio.sfx('blast');
    var base = Math.atan2(player.cy() - this.cy(), player.cx() - this.cx());
    for (var i = 0; i < n; i++) {
      var a = base + (i - (n - 1) / 2) * 0.20;
      world.spawnShot({ x: this.cx(), y: this.cy(), vx: Math.cos(a) * 4.4, vy: Math.sin(a) * 4.4,
        w: 8, h: 5, dmg: 10, owner: 'enemy', color: PAL.raRed, life: 2.0 });
    }
  };
  RaOne1.prototype.draw = function (cam, player, world) {
    var fx = Math.round(this.cx() - cam.x), fy = Math.round(this.y + this.h - cam.y);
    if (world) ent.contactShadow(this, world, cam);
    var pose = bossPose(this);
    if (this.act === 'charge') Gfx.glow(fx, fy - 24, 30, PAL.raRed, 0.4);
    drawRa(fx, fy, { face: this.face, anim: pose[0], frame: pose[1],
                     hurt: this.hurtT > 0, trail: this.act === 'charge' });
  };

  /* ================= RA.ONE v2.0 — THE SHAPESHIFTER ================= */
  function RaOne2(x, y, level, game) {
    Boss.call(this, x, y, level, game);
    this.hp = this.maxhp = 320;
    this.name = 'RA.ONE v2.0';
    this.sub = 'SHAPESHIFT / MIMIC';
    this.mimic = false; this.mimicT = 0; this.blockType = null;
    this.decoys = []; this.morphT = 0;
  }
  RaOne2.prototype = Object.create(Boss.prototype);
  RaOne2.prototype.damageMult = function (kind) {
    if (this.mimic && kind && kind === this.blockType) return 0.15;
    return this.mimic ? 0.75 : 1;
  };
  RaOne2.prototype.update = function (dt, world, player) {
    this.t += dt; this.anim += dt * 9;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.morphT > 0) this.morphT -= dt;
    if (this.intro > 0) { this.intro -= dt; this.physics(world); return; }

    var dx = player.cx() - this.cx(), adx = Math.abs(dx);
    this.face = dx > 0 ? 1 : -1;
    var enraged = this.hp < this.maxhp * 0.45;

    // he copies your last move and shuts it down; you have to change hands
    if (this.mimic) {
      this.mimicT -= dt;
      if (this.mimicT <= 0) { this.mimic = false; this.blockType = null; this.morphT = 0.4; }
      else if (player.lastAttackKind && player.lastAttackKind !== this.blockType && Math.random() < dt * 1.2) {
        this.blockType = player.lastAttackKind;
        this.game && this.game.toast('HE COPIED YOUR ' + (this.blockType === 'melee' ? 'FIST' : 'BLAST'), PAL.magenta);
      }
    }

    if (this.act) {
      this.actT -= dt;
      switch (this.act) {
        case 'blink':
          this.state = 'idle';
          if (this.actT <= 0) {
            world.parts.burst(this.cx(), this.cy(), 16, { color: PAL.raSeam, glow: true });
            var nx = player.cx() + (Math.random() < 0.5 ? -60 : 60);
            this.x = C.clamp(nx, 32, world.pxW - 48);
            this.y = player.y - 8;
            world.parts.burst(this.cx(), this.cy(), 16, { color: PAL.raSeam, glow: true });
            Audio.sfx('dash');
          }
          break;
        case 'rush':
          this.vx = this.face * 6.0; this.state = 'run';
          if (this.hitWall) { this.actT = 0; this.hitWall = false; }
          break;
        case 'mirror':
          this.state = 'attack';
          if (this.actT <= 0) this.mirrorVolley(world, player);
          break;
        case 'sweep':
          this.state = 'attack';
          if (this.actT <= 0) {
            Audio.sfx('blast'); Gfx.shake(3, 0.2);
            for (var i = 0; i < 6; i++) {
              var a = -Math.PI / 2 + (i - 2.5) * 0.28;
              world.spawnShot({ x: this.cx(), y: this.cy() - 6, vx: Math.cos(a) * 3.6, vy: Math.sin(a) * 3.6,
                w: 7, h: 5, dmg: 11, owner: 'enemy', color: PAL.magenta, life: 2.4, homing: enraged ? 0.05 : 0 });
            }
          }
          break;
      }
      if (this.actT <= 0) { this.act = null; this.cool = enraged ? 0.5 : 0.85; }
    } else {
      this.state = Math.abs(this.vx) > 0.4 ? 'run' : 'idle';
      this.vx = C.approach(this.vx, adx > 80 ? this.face * 1.9 : -this.face * 1.1, 0.26);
      this.cool -= dt;
      if (this.cool <= 0) {
        var r = Math.random();
        if (!this.mimic && r < 0.3) {
          this.mimic = true; this.mimicT = enraged ? 7 : 5; this.morphT = 0.5;
          this.blockType = player.lastAttackKind || 'melee';
          Audio.sfx('detach'); Gfx.flash(PAL.magenta, 0.3, 0.2);
          this.game && this.game.toast('HE IS WEARING YOUR FACE', PAL.magenta);
        }
        else if (r < 0.5) { this.act = 'blink'; this.actT = 0.3; }
        else if (r < 0.72) { this.act = 'rush'; this.actT = 0.55; }
        else if (r < 0.88) { this.act = 'mirror'; this.actT = 0.4; }
        else { this.act = 'sweep'; this.actT = 0.45; }
      }
    }
    this.physics(world);
    if (this.onGround && !this.act) this.vx *= 0.9;
  };
  RaOne2.prototype.mirrorVolley = function (world, player) {
    Audio.sfx('blast');
    // he throws your own blast back at you, from two mirror images
    for (var s = -1; s <= 1; s += 2) {
      var ox = this.cx() + s * 26;
      world.parts.burst(ox, this.cy(), 10, { color: PAL.hart, glow: true });
      var a = Math.atan2(player.cy() - this.cy(), player.cx() - ox);
      world.spawnShot({ x: ox, y: this.cy(), vx: Math.cos(a) * 5.0, vy: Math.sin(a) * 5.0,
        w: 8, h: 5, dmg: 12, owner: 'enemy', color: PAL.hart, life: 2.2 });
    }
  };
  RaOne2.prototype.draw = function (cam, player, world) {
    var fx = Math.round(this.cx() - cam.x), fy = Math.round(this.y + this.h - cam.y);
    if (world) ent.contactShadow(this, world, cam);
    var pose = bossPose(this);

    if (this.morphT > 0) {
      // mid-shift: the silhouette tears into scanlines
      for (var i = 0; i < 8; i++) {
        Gfx.rectA(fx - 18 + Math.random() * 36, fy - 4 - Math.random() * 40,
                  16, 2, PAL.raSeam, 0.45);
      }
    }
    if (this.mimic) {
      // he is wearing your face. Same rig, your colours, wrong light.
      drawRa(fx, fy, { face: this.face, anim: pose[0], frame: pose[1],
                       hurt: this.hurtT > 0, sheet: ent.sheets().gone,
                       scale: 1.15, eye: PAL.magenta, trail: this.act === 'rush' });
      Gfx.glow(fx, fy - 22, 26, PAL.magenta, 0.35);
      Gfx.ring(fx, fy - 20, 20 + Math.sin(this.t * 5) * 3, PAL.magenta, 1, 0.4);
    } else {
      drawRa(fx, fy, { face: this.face, anim: pose[0], frame: pose[1],
                       hurt: this.hurtT > 0, trail: this.act === 'rush' });
    }
  };

  /* ================= RA.ONE v3.0 — THE THIRD LEVEL ================= */
  /* Phase 1 PROVOKE : he cannot be damaged. Break his guard.
     Phase 2 ONE BULLET: the anti-H.A.R.T. round. It only kills an
             attached H.A.R.T. Detach, and let him waste it.
     Phase 3 TEN COPIES: only the original casts a shadow. */
  function RaOne3(x, y, level, game) {
    Boss.call(this, x, y, level, game);
    this.hp = this.maxhp = 300;
    this.name = 'RA.ONE v3.0';
    this.sub = 'THE THIRD LEVEL';
    this.phase = 1;
    this.guard = 100; this.guardMax = 100;
    this.immune = true; this.invulnLabel = 'IMMUNE — BREAK HIS GUARD';
    this.aimT = 0; this.aiming = false; this.bulletSpent = false;
    this.clones = []; this.realIdx = 0; this.shuffleT = 0; this.hitsOnReal = 0;
    this.pulseT = 0; this.contact = 14;
    this.bannerT = 0;
  }
  RaOne3.prototype = Object.create(Boss.prototype);

  RaOne3.prototype.onImmuneHit = function (n, kind, world) {
    if (this.phase !== 1) return;
    this.guard -= n * 0.85;
    Audio.sfx('punch');
    if (this.guard <= 0) {
      this.guard = 0;
      this.enterPhase2(world);
    }
  };

  RaOne3.prototype.enterPhase2 = function (world) {
    this.phase = 2; this.bannerT = 3.4;
    this.invulnLabel = 'ONE BULLET — DETACH YOUR H.A.R.T. [H]';
    this.aiming = false; this.aimT = 0; this.cool = 1.6;
    Audio.sfx('bossroar'); Gfx.flash(PAL.raRed, 0.5, 0.4); Gfx.shake(5, 0.6);
    this.game && this.game.unlockShardByTitle('RULE 4 — THE ONE BULLET');
    this.game && this.game.toast('HE HAS DRAWN THE ANTI-H.A.R.T. GUN', PAL.raRed);
  };

  RaOne3.prototype.enterPhase3 = function (world) {
    this.phase = 3; this.immune = false; this.bannerT = 3.4;
    this.invulnLabel = 'TEN COPIES — ONLY THE ORIGINAL CASTS A SHADOW';
    this.bulletSpent = true;
    Audio.sfx('bossroar'); Gfx.flash('#ffffff', 0.7, 0.6); Gfx.shake(7, 0.9);
    this.game && this.game.unlockShardByTitle('THE TRICK');
    this.game && this.game.unlockShardByTitle('THE SHADOW');
    this.game && this.game.toast('TEN COPIES. ONE SHADOW.', PAL.gold);
    this.spawnClones(world);
  };

  RaOne3.prototype.spawnClones = function (world) {
    this.clones = [];
    var floorY = this.y;
    for (var i = 0; i < 10; i++) {
      this.clones.push({
        x: 40 + i * ((world.pxW - 130) / 9), y: floorY,
        alive: true, t: Math.random() * 6, face: -1, fade: 0
      });
    }
    this.realIdx = C.randInt(0, 9);
    this.shuffleT = 7;
  };

  RaOne3.prototype.shuffle = function (world) {
    var alive = [];
    for (var i = 0; i < this.clones.length; i++) if (this.clones[i].alive) alive.push(i);
    if (!alive.length) return;
    for (var j = 0; j < this.clones.length; j++) {
      var c = this.clones[j];
      if (!c.alive) continue;
      world.parts.burst(c.x + 11, c.y + 20, 10, { color: PAL.raSeam, glow: true });
      c.x = C.clamp(40 + Math.random() * (world.pxW - 130), 32, world.pxW - 60);
      c.fade = 0.35;
    }
    this.realIdx = C.pick(alive);
    this.shuffleT = 6 + Math.random() * 2;
    Audio.sfx('detach');
  };

  RaOne3.prototype.update = function (dt, world, player) {
    this.t += dt; this.anim += dt * 9;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.bannerT > 0) this.bannerT -= dt;
    if (this.intro > 0) { this.intro -= dt; this.physics(world); return; }

    var dx = player.cx() - this.cx();
    this.face = dx > 0 ? 1 : -1;

    if (this.phase === 1) this.updateP1(dt, world, player, dx);
    else if (this.phase === 2) this.updateP2(dt, world, player, dx);
    else this.updateP3(dt, world, player);
  };

  /* --- phase 1: he is simply better than you --- */
  RaOne3.prototype.updateP1 = function (dt, world, player, dx) {
    var adx = Math.abs(dx);
    if (this.act) {
      this.actT -= dt;
      if (this.act === 'rush') {
        this.vx = this.face * 6.2; this.state = 'run';
        if (this.hitWall) { this.actT = 0; this.hitWall = false; }
      } else if (this.act === 'arc') {
        this.state = 'attack';
        if (this.actT <= 0) {
          Audio.sfx('blast');
          for (var i = 0; i < 7; i++) {
            var a = (i / 7) * Math.PI * 2 + this.t;
            world.spawnShot({ x: this.cx(), y: this.cy(), vx: Math.cos(a) * 3.6, vy: Math.sin(a) * 3.6,
              w: 7, h: 5, dmg: 10, owner: 'enemy', color: PAL.raRed, life: 2.2 });
          }
        }
      } else if (this.act === 'mind') {
        this.state = 'attack';
        if (this.actT <= 0) {
          // mind control: he reads you and turns your own controls around
          Audio.sfx('detach'); Gfx.flash(PAL.magenta, 0.4, 0.3);
          player.invertT = 2.4;
          this.game && this.game.toast('HE IS IN YOUR HEAD — CONTROLS INVERTED', PAL.magenta);
          world.parts.burst(this.cx(), this.cy(), 30, { color: PAL.magenta, glow: true, smax: 4 });
        }
      }
      if (this.actT <= 0) { this.act = null; this.cool = 0.7; }
    } else {
      this.state = Math.abs(this.vx) > 0.4 ? 'run' : 'idle';
      this.vx = C.approach(this.vx, adx > 70 ? this.face * 2.0 : -this.face * 1.2, 0.26);
      this.cool -= dt;
      if (this.cool <= 0) {
        var r = Math.random();
        if (r < 0.42) { this.act = 'rush'; this.actT = 0.55; }
        else if (r < 0.8) { this.act = 'arc'; this.actT = 0.45; }
        else { this.act = 'mind'; this.actT = 0.7; }
      }
    }
    this.physics(world);
    if (this.onGround && !this.act) this.vx *= 0.9;
  };

  /* --- phase 2: the one bullet --- */
  RaOne3.prototype.updateP2 = function (dt, world, player, dx) {
    this.state = 'idle';
    this.vx = C.approach(this.vx, 0, 0.3);
    if (!this.aiming) {
      this.cool -= dt;
      if (this.cool <= 0) { this.aiming = true; this.aimT = 2.6; Audio.sfx('charge'); }
    } else {
      this.aimT -= dt;
      this.state = 'attack';
      if (this.aimT <= 0) {
        this.aiming = false; this.cool = 2.4;
        this.fireAntiHart(world, player);
      }
    }
    this.physics(world);
  };

  RaOne3.prototype.fireAntiHart = function (world, player) {
    Audio.sfx('shot'); Gfx.shake(4, 0.4); Gfx.flash(PAL.raRed, 0.4, 0.25);
    var a = Math.atan2(player.cy() - this.cy(), player.cx() - this.cx());
    world.spawnShot({
      x: this.cx(), y: this.cy(), vx: Math.cos(a) * 6.6, vy: Math.sin(a) * 6.6,
      w: 10, h: 6, dmg: 9999, owner: 'antihart', color: PAL.raRed,
      life: 3.0, antiHart: true, homing: 0.09, big: true
    });
  };

  /* --- phase 3: ten copies, one shadow --- */
  RaOne3.prototype.updateP3 = function (dt, world, player) {
    this.shuffleT -= dt;
    if (this.shuffleT <= 0) this.shuffle(world);
    this.pulseT -= dt;

    var alive = 0, real = this.clones[this.realIdx];
    for (var i = 0; i < this.clones.length; i++) {
      var c = this.clones[i];
      if (!c.alive) continue;
      alive++;
      c.t += dt;
      if (c.fade > 0) c.fade -= dt;
      c.face = player.cx() > c.x + 9 ? 1 : -1;
      c.x += Math.sin(c.t * 0.8 + i) * 0.35;
    }
    // the pack takes potshots
    if (this.pulseT <= 0 && alive > 0) {
      this.pulseT = C.clamp(2.6 - (10 - alive) * 0.12, 0.9, 2.6);
      var shooter = null, tries = 0;

        var sx = VW - ((t * 1100 + h1(i) * 1600) % (VW + 320));
        Gfx.rectA(sx, sy, 34 + h1(i) * 70, 1, '#ffb400', 0.13);
      }
      for (i = 0; i < 8; i++) {
        var kx = (t * 700 + i * 190) % (VW + 200) - 100;
        if (h1(Math.floor(t * 2) + i) > 0.7) {
          Gfx.rectA(VW - kx, VH - 40 + h1(i) * 20, 3, 1, '#ffd27a', 0.5);
        }
      }
    },

    /* ---------- THE GRID: ten heads in the dark ---------- */
    grid: function (cam, t, game) {
      Gfx.rect(0, 0, VW, VH, '#02030a');
      var hy = VH * 0.40, i;

      /* RAVAN. Shah Rukh Khan described Ra.One as the new-age version of
         Raavan — "a mixture of ten different evil characters". Ten heads
         watch the third level. Ten copies happen in it. */
      var rx = VW / 2 - cam.x * 0.05, ry = hy - 46;
      Gfx.ctx.globalAlpha = 0.5;
      Gfx.ctx.fillStyle = '#080d18';
      Gfx.ctx.beginPath();
      Gfx.ctx.ellipse(rx, ry + 40, 190, 54, 0, 0, Math.PI * 2);
      Gfx.ctx.fill();
      for (i = 0; i < 10; i++) {
        var a = (i - 4.5) * 0.26;
        var hx = rx + Math.sin(a) * 150;
        var hh = ry + 16 - Math.cos(a) * 34;
        Gfx.ctx.fillStyle = '#0b1220';
        Gfx.ctx.beginPath();
        Gfx.ctx.ellipse(hx, hh, 15, 19, a * 0.7, 0, Math.PI * 2);
        Gfx.ctx.fill();
        // crown spike
        Gfx.ctx.fillStyle = '#0d1626';
        Gfx.ctx.beginPath();
        Gfx.ctx.moveTo(hx - 5, hh - 15);
        Gfx.ctx.lineTo(hx, hh - 30);
        Gfx.ctx.lineTo(hx + 5, hh - 15);
        Gfx.ctx.fill();
      }
      Gfx.ctx.globalAlpha = 1;
      for (i = 0; i < 10; i++) {
        var a2 = (i - 4.5) * 0.26;
        var ex = rx + Math.sin(a2) * 150, ey = ry + 18 - Math.cos(a2) * 34;
        var blink = Math.sin(t * 0.7 + i * 1.9) > 0.86 ? 0.05 : 1;
        Gfx.rectA(ex - 6, ey, 4, 2, PAL.raRed, 0.75 * blink);
        Gfx.rectA(ex + 2, ey, 4, 2, PAL.raRed, 0.75 * blink);
        Gfx.glow(ex, ey + 1, 11, PAL.raRed, 0.22 * blink);
      }

      /* horizon */
      Gfx.glow(VW / 2, hy, 300, '#0e3f6e', 0.4);
      Gfx.rectA(0, hy, VW, 1, PAL.hart, 0.6);
      Gfx.glow(VW / 2, hy, 90, PAL.hart, 0.18);

        Gfx.line(vpx + i * 7, hy, vpx + i * 78, VH, '#17527f', 1);
        Gfx.ctx.globalAlpha = 1;

        var p = (i / 16 + (t * 0.14) % (1 / 16));
        var yy = hy + Math.pow(p, 2.5) * (VH - hy);
        Gfx.rectA(0, yy, VW, 1, '#17527f', 0.26);
      }

      var py = hy + Math.pow(pulseP, 2.5) * (VH - hy);
      Gfx.rectA(0, py, VW, 1, PAL.hart, 0.35 * (1 - pulseP));

        var vx = (((i * 63 - cam.x * 0.3) % (VW + 63)) + VW + 63) % (VW + 63) - 31;
        Gfx.rectA(vx, 0, 1, hy, '#0a2745', 0.7);

          Gfx.rectA(vx - 1, gy, 3, 5, PAL.hart, 0.30);
        }
      }
    }
  };

  /* Ra.One in the parallax, standing on something in the middle distance,

    if (!list || !list.length) return;
    for (var i = 0; i < list.length; i++) {
      var st = list[i];
      var sx = st[0] * T - cam.x * (st[2] || 0.55);
      if (sx < -60 || sx > VW + 60) continue;
      var sy = st[1] * T - cam.y * 0.2;
      var face = (cam.x + VW / 2) > (st[0] * T) ? -1 : 1;
      var breathe = Math.sin(t * 1.1 + i) * 0.5;
      RA.spr.draw(RA.spr.build().ghost, 'idle', Math.floor(t * 0.8) + i,

      Gfx.glow(sx, sy - 34, 9, PAL.raRed, 0.35 + 0.15 * Math.sin(t * 2 + i));
      Gfx.rectA(sx - 4, sy - 35, 3, 1, PAL.raRed, 0.8);
      Gfx.rectA(sx + 1, sy - 35, 3, 1, PAL.raRed, 0.8);
    }
  }

  /* the scrim keeps the city from ever reading as a platform */

  function drawTiles(world, cam, t) {
    bakeTiles();

    var x0 = Math.max(0, Math.floor(cam.x / T) - 1);
    var x1 = Math.min(world.w - 1, Math.floor((cam.x + VW) / T) + 1);
    var y0 = Math.max(0, Math.floor(cam.y / T) - 1);
    var y1 = Math.min(world.h - 1, Math.floor((cam.y + VH) / T) + 1);
    var ctx = Gfx.ctx;

    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var ch = world.tiles[y][x];
        if (ch === '.') continue;
        var px = Math.round(x * T - cam.x), py = Math.round(y * T - cam.y);

        if (ch === '#') {
          ctx.drawImage(set.body, px, py);
          if (!world.isSolid(x, y - 1)) {
            ctx.drawImage(set.top, px, py);
            if ((x * 5 + y * 3) % 11 === 0) Gfx.glow(px + T / 2, py, 12, set.edge, 0.16);
          }
          if (!world.isSolid(x - 1, y)) Gfx.rectA(px, py, 1, T, '#000', 0.45);
          if (!world.isSolid(x + 1, y)) Gfx.rectA(px + T - 1, py, 1, T, '#000', 0.45);
        } else if (ch === '=') {
          ctx.drawImage(set.plat, px, py);
          if (x % 5 === 0) Gfx.glow(px + T / 2, py + 1, 10, set.edge, 0.14);
        } else if (ch === '^') {

          Gfx.rect(px, py, T, 1, '#5a6a86');
          Gfx.rect(px, py + 3, T, 1, '#131a26');
          if ((x % 3) === 0) Gfx.rect(px + 6, py + 3, 3, 5, '#2b3547');
          for (var s = 0; s < 3; s++) {
            var a = t * 9 + x + s * 2;
            var ax = px + 2 + s * 5 + Math.sin(a) * 1.6;
            Gfx.rectA(ax, py + 5 + Math.sin(a * 1.7) * 2, 2, T - 7, PAL.raRed, 0.9);
            Gfx.rectA(ax, py + 5, 1, 3, '#ffd0d6', 0.7);

  /* ================= HUD ================= */

    Gfx.rect(x - 1, y - 1, w + 2, h + 2, 'rgba(2,5,12,0.85)');
    Gfx.rect(x, y, w, h, back || '#101a28');
    var fw = Math.max(0, Math.round(w * C.clamp(pct, 0, 1)));

    Gfx.rectA(x, y, fw, 1, '#ffffff', 0.4);
    Gfx.rectA(x, y + h - 1, fw, 1, '#000000', 0.25);

    for (var i = 1; i < 5; i++) Gfx.rectA(x + w * i / 5, y, 1, h, '#000', 0.35);
    if (label) Gfx.text(label, x, y - 9, { size: 8, color: labelColor || PAL.bone });
  }

  function drawHUD(game, world, player, boss) {
    var pad = 10;
    panel(pad - 4, pad - 2, 176, 48);

    bar(pad, pad + 10, 150, 8, player.hp / player.maxhp,
        player.hp > 30 ? PAL.green : PAL.raRed, '#0e1a12', 'SYSTEM INTEGRITY');
    bar(pad, pad + 32, 150, 6, player.hart / player.hartMax,
        player.hartDetached ? PAL.steelLite : PAL.hart, '#0c1a24',
        player.hartDetached ? 'H.A.R.T. DETACHED' : 'H.A.R.T.',
        player.hartDetached ? PAL.amber : PAL.hart);

    // core icon: it beats, and it goes out when you put it down
    var ix = pad + 162, iy = pad + 22;
    if (player.hartDetached) {
      Gfx.ring(ix, iy, 6, PAL.steel, 1, 0.7);
    } else {
      var pl = 0.6 + 0.4 * Math.sin(game.t * 4);
      Gfx.glow(ix, iy, 10 * pl, PAL.hart, 0.5);
      RA.spr.drawProp('hartShard', ix, iy);
    }
    if (player.charge > 0.55) {
      Gfx.text('CHARGED', pad + 2, pad + 42, { size: 8, color: PAL.hartGlow, glow: PAL.hart });
    }

    Gfx.text('SCORE ' + String(game.score).padStart(7, '0'), VW - pad, pad,
      { size: 9, align: 'right', color: PAL.gold });
    Gfx.text('LUCIFER x' + game.lives, VW - pad, pad + 12,
      { size: 8, align: 'right', color: PAL.bone });
    if (game.combo > 1) {
      Gfx.text('x' + game.combo + ' COMBO', VW - pad, pad + 24,
        { size: 8, align: 'right', color: PAL.amber, glow: PAL.amber });
    }

    Gfx.text(world.level.name + ' — ' + world.level.place, VW / 2, pad,
      { size: 8, align: 'center', color: PAL.steelLite });

    if (world.level.timer) {
      var left = Math.max(0, game.timeLeft);
      var crit = left < 20;
      Gfx.text('CST IN ' + left.toFixed(1) + 's', VW / 2, pad + 12,
        { size: 11, align: 'center', color: crit ? PAL.raRed : PAL.white,
          glow: crit ? PAL.raRed : null });
      if (crit) Gfx.rectA(0, 0, VW, VH, PAL.raRed, 0.04 + 0.03 * Math.sin(game.t * 9));
    }

    Gfx.text('SHARDS ' + game.shardsFound + '/' + game.shardsTotal, pad, VH - 16,
      { size: 8, color: PAL.amber });

    if (boss && !boss.dead && boss.intro <= 0) {
      var bw = 300, bx = (VW - bw) / 2, by = VH - 40;
      panel(bx - 8, by - 26, bw + 16, 40);

        { size: 11, align: 'center', color: PAL.raRed, glow: PAL.raRed });
      Gfx.text(boss.sub || '', VW / 2, by - 10,
        { size: 7, align: 'center', color: PAL.steelLite });
      bar(bx, by, bw, 7, boss.hp / boss.maxhp, PAL.raRed, '#20080c');
      if (boss.phase === 1 && boss.guardMax) {
        bar(bx, by + 11, bw, 4, boss.guard / boss.guardMax, PAL.steelLite, '#111820');
      }
      if (boss.immune && boss.invulnLabel) {
        Gfx.text(boss.invulnLabel, VW / 2, by + 18,
          { size: 8, align: 'center', color: PAL.amber, glow: PAL.amber });
      } else if (boss.invulnLabel && boss.phase === 3) {
        Gfx.text(boss.invulnLabel, VW / 2, by + 18, { size: 8, align: 'center', color: PAL.gold });
      }
      if (boss.mimic) {
        Gfx.text('MIMIC ACTIVE — BLOCKING ' + (boss.blockType === 'melee' ? 'MELEE' : 'BLAST') +

          { size: 8, align: 'center', color: PAL.magenta, glow: PAL.magenta });

    for (var i = 0; i < game.toasts.length; i++) {
      var ts = game.toasts[i];
      var a = C.clamp(ts.t / 0.6, 0, 1);

        { size: 10, align: 'center', color: ts.color, alpha: a, glow: ts.color });

      Gfx.text('CONTROLS INVERTED', VW / 2, VH - 60,
        { size: 10, align: 'center', color: PAL.magenta, glow: PAL.magenta });
      Gfx.rectA(0, 0, VW, VH, PAL.magenta, 0.05);
    }
    if (player.hartDetached) {
      Gfx.rectA(0, 0, VW, VH, PAL.hartDeep, 0.06);
      Gfx.text('RUNNING ON RESIDUAL CHARGE — [H] TO RECOVER YOUR H.A.R.T.',
        VW / 2, 112, { size: 8, align: 'center', color: PAL.amber });
    }
  }

  RA.hud = { Back: Back, scrim: scrim, drawTiles: drawTiles, drawHUD: drawHUD,

    difficulty: 0,                       // 0 NORMAL, 1 LUCIFER

    hi: 0, playerName: 'LUCIFER',
    menuIdx: 0, codexCat: 0, codexIdx: 0, codexScroll: 0,

      if (Input.pressed('codex')) { Audio.sfx('select'); this.setState('codex'); }
    },

    codexCats: function () {
      var cats = [], seen = {};
      for (var i = 0; i < RA.CODEX.length; i++) {
        if (!seen[RA.CODEX[i].cat]) { seen[RA.CODEX[i].cat] = 1; cats.push(RA.CODEX[i].cat); }
      }
      return cats;
    },
    codexList: function () {
      var cat = this.codexCats()[this.codexCat], out = [];
      for (var i = 0; i < RA.CODEX.length; i++) if (RA.CODEX[i].cat === cat) out.push(RA.CODEX[i]);
      return out;
    },
    upCodex: function (dt) {
      var cats = this.codexCats(), list = this.codexList();
      if (Input.pressed('left')) { this.codexCat = (this.codexCat + cats.length - 1) % cats.length; this.codexIdx = 0; Audio.sfx('menu'); }
      if (Input.pressed('right')) { this.codexCat = (this.codexCat + 1) % cats.length; this.codexIdx = 0; Audio.sfx('menu'); }
      if (Input.pressed('up')) { this.codexIdx = (this.codexIdx + list.length - 1) % list.length; Audio.sfx('menu'); }
      if (Input.pressed('down')) { this.codexIdx = (this.codexIdx + 1) % list.length; Audio.sfx('menu'); }
      if (Input.pressed('pause') || Input.pressed('codex')) { Audio.sfx('select'); this.setState('title'); }
    },

    upStory: function (dt) {
      var s = RA.STORY[this.storyKey];
      var total = s.lines.join('\n').length;
      this.storyChars += dt * 130;
      if (Input.anyStart()) {
        if (this.storyChars < total) { this.storyChars = total; Audio.sfx('menu'); }
        else {
          Audio.sfx('select');
          var n = this.nextAfterStory; this.nextAfterStory = null;
          if (n) n();
        }
      }
    },

    upPause: function (dt) {
      if (Input.pressed('pause') || Input.pressed('start')) { Audio.sfx('select'); this.setState('play'); }
      if (Input.pressed('codex')) { Audio.sfx('select'); this.setState('codex'); }
    },

    upClear: function (dt) {
      this.clearT += dt;
      if (this.clearT > 1.6 && Input.anyStart()) {
        Audio.sfx('select');
        var nxt = this.level + 1;
        if (nxt < RA.LEVELS.length) {
          var self = this;
          this.startStory(RA.LEVELS[nxt].story, function () { self.startLevel(nxt); });
        } else {
          this.startStory('win', function () { Game.setState('ending'); Audio.play('ending'); });
        }
      }
    },

    upGameOver: function (dt) {
      this.contT -= dt;
      if (Input.anyStart() && this.contT > 0) {
        Audio.sfx('levelup');
        this.lives = 3;
        this.startLevel(this.level);
      } else if (this.contT <= 0 && (Input.anyStart() || this.stateT > 14)) {
        this.save();
        this.setState('title'); Audio.play('title');
      }
    },

    upEnding: function (dt) {
      if (this.stateT > 2.5 && Input.anyStart()) {
        Audio.sfx('select');
        this.startStory('epilogue', function () { Game.setState('credits'); });
      }
    },

    /* =========================================================
       PLAY
       ========================================================= */
    upPlay: function (dt) {
      var w = this.world, p = this.player, lv = w.level;
      if (Input.pressed('pause')) { Audio.sfx('select'); this.setState('pause'); return; }
      if (this.hitStop > 0) { this.hitStop -= dt; return; }
      w.time += dt;

      /* --- death / respawn --- */
      if (p.dead) {
        this.respawnT += dt;
        p.update(dt, w, Input, false);
        w.parts.update(dt);
        w.cam.follow(p, false);
        if (this.respawnT > 2.2) {
          this.respawnT = 0;
          this.lives--;
          if (this.lives <= 0) {
            this.contT = 9.99;
            this.setState('gameover');
            Audio.stop();
            if (this.score > this.hi) { this.hi = this.score; }
            this.save();
          } else this.respawn();
        }
        return;
      }

      /* --- the runaway local --- */
      if (lv.timer) {
        this.timeLeft -= dt;
        if (this.timeLeft <= 0) {
          this.timeLeft = 0;
          this.toast('THE TRAIN REACHED CST', PAL.raRed);
          p.hurt(9999, w, 0);
          return;
        }
      }

      /* --- he does not wait for the end of the level --- */
      if (this.incursionsLeft && this.incursionsLeft.length && !this.bossActive) {
        if (p.x > this.incursionsLeft[0] * T) {
          this.incursionsLeft.shift();
          var ix = p.cx() + (p.face > 0 ? 120 : -120);
          ix = C.clamp(ix, 40, w.pxW - 60);
          var iy = p.y - 16;
          w.actors.push(new ent.Incursion(ix, iy, this));
          Audio.sfx('bossroar');
          Gfx.flash(PAL.raRed, 0.45, 0.35);
          Gfx.shake(4, 0.4);
          this.toast('RA.ONE: WHERE IS LUCIFER?', PAL.raRed);
        }
      }

      /* --- boss gate --- */
      if (!this.bossActive && p.x > w.bossGateX && lv.boss) {
        this.bossActive = true;
        this.boss = RA.bosses.make(lv.boss, w.bossSpawnX, 40, lv, this);
        // drop him onto the arena floor
        var by = 0;
        while (by < w.h && !w.isSolid(Math.floor(w.bossSpawnX / T), by)) by++;
        this.boss.y = by * T - this.boss.h - 1;
        Audio.play('boss');
        Audio.sfx('bossroar');
        Gfx.flash(PAL.raRed, 0.5, 0.5);
        this.toast('RA.ONE HAS ENTERED THE LEVEL', PAL.raRed);
      }

      /* --- player --- */
      p.update(dt, w, Input, true);
      if (p.hartObj) p.updateHart(dt, w);

      /* --- the train sets a floor on your pace, not a ceiling --- */
      if (lv.autoScroll && !this.bossActive) {
        var follow = C.clamp(p.cx() - VW / 2, 0, Math.max(0, w.pxW - VW));
        w.cam.x = Math.min(Math.max(0, w.pxW - VW),
                           Math.max(w.cam.x + lv.autoScroll * (dt / STEP), follow));
        w.cam.y = C.lerp(w.cam.y, C.clamp(p.y - VH / 2 + 20, 0, Math.max(0, w.pxH - VH)), 0.06);
        if (p.x < w.cam.x + 6) {
          p.x = w.cam.x + 6;
          if (Math.floor(this.t * 3) % 2 === 0) p.hurt(6, w, 1);
        }
      } else {
        w.cam.follow(p, false);
      }

      /* --- arena lock --- */
      if (this.bossActive) {
        var right = Math.min(w.pxW, this.arenaLeft + Math.max(VW, 40 * T));
        w.cam.x = C.clamp(w.cam.x, this.arenaLeft, Math.max(this.arenaLeft, right - VW));
        if (p.x < this.arenaLeft + 4) { p.x = this.arenaLeft + 4; p.vx = Math.max(0, p.vx); }
      }

      /* --- actors --- */
      var i, a;
      for (i = w.actors.length - 1; i >= 0; i--) {
        a = w.actors[i];
        if (Math.abs(a.cx() - p.cx()) > VW * 1.4) continue;   // sleep off-screen
        a.update(dt, w, p);
        if (a.remove) { w.actors.splice(i, 1); this.bumpCombo(); continue; }
        if (C.aabb(a, p) && !p.dead) {
          var dmg = a.contact || ((a.type === 'drone' && a.diveT > 0) ? 10 : 7);
          p.hurt(dmg * (this.difficulty ? 1.4 : 1), w, a.cx() < p.cx() ? 1 : -1);
        }
      }

      /* --- boss --- */
      var b = this.boss;
      if (b && !b.dead) {
        b.update(dt, w, p);
        if (b.phase !== 3 && b.intro <= 0 && C.aabb(b, p) && !p.dead) {
          p.hurt(b.contact * (this.difficulty ? 1.4 : 1), w, b.cx() < p.cx() ? 1 : -1);
        }
        if (b.phase === 3) {
          var cbs = b.cloneBoxes();
          for (i = 0; i < cbs.length; i++) {
            if (C.aabb(cbs[i], p) && !p.dead) p.hurt(8, w, cbs[i].x < p.cx() ? 1 : -1);
          }
        }
      } else if (b && b.dead) {
        b.deadT = (b.deadT || 0) + dt;
        if (b.deadT > 2.4 && this.state === 'play') {
          this.addScore(2000 + this.lives * 500 + Math.round(p.hp) * 10);
          this.clearT = 0;
          this.setState('clear');
          Audio.play('title');
          Audio.sfx('levelup');
          this.save();
          return;
        }
      }

      /* --- melee hitbox --- */
      if (p.hitBox) {
        var hb = p.hitBox;
        for (i = 0; i < w.actors.length; i++) {
          a = w.actors[i];
          if (hb.hit.indexOf(a) >= 0) continue;
          if (C.aabb(hb, a)) {
            hb.hit.push(a);
            a.damage(hb.dmg * (this.difficulty ? 0.85 : 1), w, p.face);
            this.hitStop = 0.045; Gfx.shake(1.5, 0.1);
            w.parts.burst(a.cx(), a.cy(), 8, { color: PAL.white, glow: true, smax: 2.5 });
          }
        }
        if (b && !b.dead && b.intro <= 0) {
          if (b.phase === 3) {
            var boxes = b.cloneBoxes();
            for (i = 0; i < boxes.length; i++) {
              if (hb.hit.indexOf('c' + boxes[i].idx) >= 0) continue;
              if (C.aabb(hb, boxes[i])) {
                hb.hit.push('c' + boxes[i].idx);
                b.hitClone(boxes[i].idx, hb.dmg, w, p);
                this.hitStop = 0.06;
              }
            }
          } else if (hb.hit.indexOf(b) < 0 && C.aabb(hb, b)) {
            hb.hit.push(b);
            b.damage(hb.dmg, w, p.face, 'melee');
            this.hitStop = 0.06; Gfx.shake(2, 0.12);
          }
        }
      }

      /* --- shots --- */
      for (i = w.shots.length - 1; i >= 0; i--) {
        var s = w.shots[i];
        s.update(dt, w, p);
        var sBox = { x: s.x, y: s.y, w: s.w, h: s.h };

        if (s.owner === 'player') {
          for (var j = 0; j < w.actors.length; j++) {
            a = w.actors[j];
            if (s.hitList.indexOf(a) >= 0) continue;
            if (C.aabb(sBox, a)) {
              s.hitList.push(a);
              a.damage(s.dmg, w, s.vx > 0 ? 1 : -1);
              w.parts.burst(s.x, s.y, 8, { color: s.color, glow: true });
              if (!s.pierce) { s.remove = true; break; }
            }
          }
          if (b && !b.dead && b.intro <= 0 && !s.remove) {
            if (b.phase === 3) {
              var bx2 = b.cloneBoxes();
              for (j = 0; j < bx2.length; j++) {
                if (s.hitList.indexOf('c' + bx2[j].idx) >= 0) continue;
                if (C.aabb(sBox, bx2[j])) {
                  s.hitList.push('c' + bx2[j].idx);
                  b.hitClone(bx2[j].idx, s.dmg, w, p);
                  if (!s.pierce) s.remove = true;
                  break;
                }
              }
            } else if (s.hitList.indexOf(b) < 0 && C.aabb(sBox, b)) {
              s.hitList.push(b);
              b.damage(s.dmg, w, s.vx > 0 ? 1 : -1, 'blast');
              w.parts.burst(s.x, s.y, 10, { color: s.color, glow: true });
              if (!s.pierce) s.remove = true;
            }
          }
        } else if (!p.dead && C.aabb(sBox, p)) {
          /* ===== THE RULE OF THE THIRD LEVEL ===== */
          if (s.antiHart) {
            s.remove = true;
            if (p.hartDetached) {
              // the one bullet, spent on a body it cannot kill
              Gfx.flash('#ffffff', 0.8, 0.6); Gfx.shake(6, 0.7);
              this.toast('THE BULLET PASSED THROUGH. IT IS SPENT.', PAL.gold);
              this.addScore(3000);
              if (b && b.enterPhase3) b.enterPhase3(w);
            } else {
              this.toast('IT ONLY KILLS A H.A.R.T. THAT IS ATTACHED', PAL.raRed);
              p.hurt(9999, w, s.vx > 0 ? 1 : -1);
            }
          } else if (p.invuln <= 0) {
            s.remove = true;
            p.hurt(s.dmg * (this.difficulty ? 1.4 : 1), w, s.vx > 0 ? 1 : -1);
          }
        }
        if (s.remove) {
          if (s.antiHart && s.life <= 0 && b && b.phase === 2 && !this.missTold) {
            this.missTold = true;
            this.toast('HE RECALLS THE ROUND. HE HAS ALL NIGHT.', PAL.steelLite);
          }
          w.shots.splice(i, 1);
        }
      }

      /* --- pickups --- */
      for (i = w.pickups.length - 1; i >= 0; i--) {
        var pk = w.pickups[i];
        pk.update(dt);
        if (C.aabb(pk, p)) {
          if (pk.kind === 'hart') {
            p.hart = Math.min(p.hartMax, p.hart + 30); this.addScore(50); Audio.sfx('pickup');
          } else if (pk.kind === 'repair') {
            p.hp = Math.min(p.maxhp, p.hp + 28); this.addScore(80); Audio.sfx('pickup');
          } else {
            this.addScore(500); this.unlockNextShard();
          }
          w.parts.burst(pk.x + 6, pk.y + 6, 12, { color: PAL.gold, glow: true });
          w.pickups.splice(i, 1);
        }
      }

      /* --- checkpoints --- */
      for (i = 0; i < w.checkpoints.length; i++) {
        var cp = w.checkpoints[i];
        if (!cp.taken && Math.abs(p.cx() - cp.x) < 20 && Math.abs(p.cy() - cp.y) < 40) {
          cp.taken = true;
          this.checkpoint = { x: cp.x, y: cp.y - 8 };
          this.toast('CHECKPOINT', PAL.hart);
          Audio.sfx('pickup');
        }
      }

      w.parts.update(dt);
    },

    /* =========================================================
       DRAW
       ========================================================= */
    draw: function () {
      Gfx.begin();
      switch (this.state) {
        case 'boot': this.drawBoot(); break;
        case 'title': this.drawTitle(); break;
        case 'codex': this.drawCodex(); break;
        case 'controls': this.drawControls(); break;
        case 'story': this.drawStory(); break;
        case 'play': this.drawPlay(); break;
        case 'pause': this.drawPlay(); this.drawPause(); break;
        case 'clear': this.drawPlay(); this.drawClear(); break;
        case 'gameover': this.drawPlay(); this.drawGameOver(); break;
        case 'ending': this.drawEnding(); break;
        case 'credits': this.drawCredits(); break;
      }
      Gfx.end();
    },

    drawPlay: function () {
      var w = this.world, p = this.player, cam = w.cam;
      hud.Back[w.level.bg](cam, this.t, this);
      hud.drawStalkers(w, cam, this.t);
      hud.scrim(w.level.bg);
      hud.drawTiles(w, cam, this.t);

      for (var i = 0; i < w.pickups.length; i++) w.pickups[i].draw(cam);
      for (i = 0; i < w.checkpoints.length; i++) {
        var cp = w.checkpoints[i];
        var cxp = Math.round(cp.x - cam.x), cyp = Math.round(cp.y - cam.y);
        Gfx.rectA(cxp - 1, cyp - 22, 2, 24, cp.taken ? PAL.hart : PAL.steel, 0.9);
        if (cp.taken) Gfx.glow(cxp, cyp - 20, 10, PAL.hart, 0.4);
      }
      for (i = 0; i < w.actors.length; i++) {
        var a = w.actors[i];
        if (Math.abs(a.cx() - cam.x - VW / 2) < VW) a.draw(cam, w);
      }
      if (this.boss && !this.boss.dead) this.boss.draw(cam, p, w);
      p.drawHart(cam, w);
      p.draw(cam, w);
      for (i = 0; i < w.shots.length; i++) w.shots[i].draw(cam);
      w.parts.draw(cam);

      // level 3 arena veil
      if (w.level.bg === 'grid') Gfx.rectA(0, 0, VW, VH, '#0a1a2e', 0.10);

      // bloom the world, then lay the HUD over it crisp
      Gfx.ctx.setTransform(1, 0, 0, 1, 0, 0);
      Gfx.post();
      Gfx.ctx.translate(Math.round(Gfx.shakeX), Math.round(Gfx.shakeY));

      hud.drawHUD(this, w, p, this.boss);

      if (this.boss && this.boss.intro > 0) {
        var a2 = C.clamp(this.boss.intro, 0, 1);
        Gfx.text(this.boss.name, VW / 2, VH / 2 - 30,
          { size: 30, align: 'center', color: PAL.raRed, glow: PAL.raRed, alpha: a2 });
        Gfx.text(this.boss.sub, VW / 2, VH / 2 + 6,
          { size: 10, align: 'center', color: PAL.bone, alpha: a2 });
      }
    },

    /* ---------- screens ---------- */
    logo: function (cx, cy, big) {
      var s = big ? 58 : 34;
      var jitter = (Math.random() < 0.06) ? C.rand(-3, 3) : 0;
      Gfx.text('RA.ONE', cx + jitter, cy, { size: s, align: 'center', color: PAL.raRed, glow: PAL.raRed });
      Gfx.text('RA.ONE', cx - jitter * 0.6, cy, { size: s, align: 'center', color: PAL.white, alpha: 0.85, shadow: false });
      Gfx.text('L U C I F E R   P R O T O C O L', cx, cy + s + 4,
        { size: big ? 12 : 9, align: 'center', color: PAL.hart, glow: PAL.hart });
    },

    drawBoot: function () {
      Gfx.rect(0, 0, VW, VH, '#020307');
      var lines = [
        'BARRON INDUSTRIES / LONDON',
        'H.A.R.T. RUNTIME v1.0 ................ OK',
        'RANDOM ACCESS CORE ................... OK',
        'MOTION CAPTURE (A. AKASHI) ........... OK',
        'AVATAR: G.ONE ........................ OK',
        'AVATAR: RA.ONE ....................... WARNING',
        '  > antagonist exceeds protagonist',
        '  > this is intentional',
        'PLAYER PROFILE ....................... LUCIFER'
      ];
      var n = Math.min(lines.length, Math.floor(this.stateT * 3.2));
      for (var i = 0; i < n; i++) {
        Gfx.text(lines[i], 40, 60 + i * 16,
          { size: 10, color: i === 5 ? PAL.amber : (i === 6 || i === 7 ? PAL.steelLite : PAL.green) });
      }
      if (this.stateT > 3 && Math.floor(this.t * 2) % 2 === 0) {
        Gfx.text('PRESS ANY KEY', VW / 2, VH - 60, { size: 12, align: 'center', color: PAL.white });
      }
      Gfx.text('AN UNOFFICIAL FAN TRIBUTE TO RA.ONE (2011)', VW / 2, VH - 24,
        { size: 7, align: 'center', color: PAL.steel });
    },

    drawTitle: function () {
      hud.Back.grid({ x: this.t * 30, y: 0 }, this.t, this);
      Gfx.rectA(0, 0, VW, VH, '#02030a', 0.45);

      /* the two of them, waiting, on either side of the menu */
      var fy = VH - 46;
      Gfx.glow(96, fy, 34, PAL.hart, 0.18);
      Gfx.rectA(60, fy, 72, 1, PAL.hart, 0.25);
      RA.spr.draw(RA.spr.build().gone, 'idle', Math.floor(this.t * 1.6), 96, fy, 1, {});
      Gfx.glow(96, fy - 20, 16, PAL.hart, 0.35);

      Gfx.glow(542, fy, 40, PAL.raRed, 0.16);
      Gfx.rectA(500, fy, 84, 1, PAL.raRed, 0.22);
      RA.bosses.drawRa(542, fy, { face: -1, anim: 'idle',
        frame: Math.floor(this.t * 1.4), scale: 1.35 });

      this.logo(VW / 2, 42, true);

      var items = [
        'START GAME',
        'CODEX  (' + this.shardsFound + '/' + this.shardsTotal + ' SHARDS)',
        'DIFFICULTY:  ' + (this.difficulty ? 'LUCIFER' : 'NORMAL'),
        'CONTROLS',
        'SOUND:  ' + (Audio.muted ? 'OFF' : 'ON')
      ];
      for (var i = 0; i < items.length; i++) {
        var sel = i === this.menuIdx;
        var y = 168 + i * 22;
        if (sel) {
          Gfx.rectA(VW / 2 - 150, y - 4, 300, 18, PAL.hart, 0.12);
          Gfx.text('>', VW / 2 - 146, y, { size: 12, color: PAL.hart });
        }
        Gfx.text(items[i], VW / 2, y,
          { size: 12, align: 'center', color: sel ? PAL.white : PAL.steelLite, glow: sel ? PAL.hart : null });
      }
      Gfx.text('HI-SCORE ' + String(this.hi).padStart(7, '0'), VW / 2, VH - 44,
        { size: 9, align: 'center', color: PAL.gold });
      Gfx.text('UNOFFICIAL FAN TRIBUTE — NO FILM ASSETS USED — ALL ART DRAWN IN CODE',
        VW / 2, VH - 22, { size: 7, align: 'center', color: PAL.steel });
    },

    drawControls: function () {
      Gfx.rect(0, 0, VW, VH, '#04060e');
      Gfx.text('CONTROLS', VW / 2, 26, { size: 20, align: 'center', color: PAL.hart, glow: PAL.hart });
      var rows = [
        ['MOVE', 'ARROWS  /  A D'],
        ['JUMP  (double)', 'SPACE  /  Z'],
        ['MELEE  (3-hit combo)', 'X  /  J'],
        ['H.A.R.T. BLAST', 'C  /  K   (hold = charged beam)'],
        ['DASH', 'SHIFT  /  L'],
        ['DETACH H.A.R.T.', 'H     (level 3 only)'],
        ['DROP THROUGH', 'DOWN + JUMP'],
        ['PAUSE', 'ESC  /  P'],
        ['CODEX', 'TAB'],
        ['MUTE', 'M']
      ];
      for (var i = 0; i < rows.length; i++) {
        Gfx.text(rows[i][0], 90, 66 + i * 22, { size: 10, color: PAL.bone });
        Gfx.text(rows[i][1], VW - 90, 66 + i * 22, { size: 10, align: 'right', color: PAL.hart });
      }
      Gfx.text('PRESS ENTER TO GO BACK', VW / 2, VH - 26, { size: 9, align: 'center', color: PAL.steelLite });
    },

    drawCodex: function () {
      Gfx.rect(0, 0, VW, VH, '#04060e');
      hud.Back.grid({ x: this.t * 12, y: 0 }, this.t * 0.4, this);
      Gfx.rectA(0, 0, VW, VH, '#02030a', 0.72);

      var cats = this.codexCats(), list = this.codexList();
      Gfx.text('CODEX', 20, 16, { size: 18, color: PAL.hart, glow: PAL.hart });
      Gfx.text('DATA SHARDS ' + this.shardsFound + '/' + this.shardsTotal, VW - 20, 20,
        { size: 9, align: 'right', color: PAL.gold });

      var cx = 20;
      for (var i = 0; i < cats.length; i++) {
        var on = i === this.codexCat;
        var wdt = Gfx.textWidth(cats[i], 9) + 16;
        if (on) Gfx.rectA(cx - 6, 40, wdt, 15, PAL.hart, 0.2);
        Gfx.text(cats[i], cx, 43, { size: 9, color: on ? PAL.white : PAL.steel });
        cx += wdt + 6;
      }
      Gfx.rectA(20, 60, VW - 40, 1, PAL.steel, 0.6);

      // list
      var top = 72;
      for (i = 0; i < list.length; i++) {
        var e = list[i], sel = i === this.codexIdx;
        var locked = e.shard && !this.unlocked[e.title];
        var y = top + i * 15;
        if (sel) Gfx.rectA(16, y - 3, 210, 14, PAL.hart, 0.14);
        Gfx.text(locked ? '??? LOCKED SHARD' : e.title, 22, y,
          { size: 8, color: locked ? PAL.steel : (sel ? PAL.white : PAL.bone) });
      }

      // detail
      var sel2 = list[this.codexIdx];
      Gfx.rectA(236, 68, VW - 256, VH - 100, '#060b16', 0.9);
      Gfx.rectA(236, 68, VW - 256, 1, PAL.hart, 0.5);
      if (sel2) {
        var lockd = sel2.shard && !this.unlocked[sel2.title];
        if (lockd) {
          Gfx.text('LOCKED', 250, 82, { size: 12, color: PAL.amber });
          var lw = Gfx.wrap('This entry is sealed behind a DATA SHARD. Find it in a level ' +
                            'and it opens. The film is in here — you just have to go and get it.', 9, VW - 290);
          for (i = 0; i < lw.length; i++) Gfx.text(lw[i], 250, 106 + i * 14, { size: 9, color: PAL.steelLite });
        } else {
          Gfx.text(sel2.title, 250, 80, { size: 11, color: PAL.hart, glow: PAL.hart });
          var lines = Gfx.wrap(sel2.body, 9, VW - 292);
          for (i = 0; i < lines.length; i++) {
            Gfx.text(lines[i], 250, 104 + i * 14, { size: 9, color: PAL.bone });
          }
        }
      }
      Gfx.text('ARROWS NAVIGATE   ESC BACK', VW / 2, VH - 20, { size: 8, align: 'center', color: PAL.steel });
    },

    drawStory: function () {
      Gfx.rect(0, 0, VW, VH, '#03040a');
      var s = RA.STORY[this.storyKey];
      // faint scan of the level colour behind the words
      Gfx.rectA(0, 0, VW, VH, PAL.deep, 0.5);
      Gfx.text(s.title, VW / 2, 44, { size: 16, align: 'center', color: PAL.raRed, glow: PAL.raRed });
      Gfx.rectA(VW / 2 - 150, 66, 300, 1, PAL.steel, 0.7);

      var shown = Math.floor(this.storyChars), used = 0;
      for (var i = 0; i < s.lines.length; i++) {
        var ln = s.lines[i];
        if (used > shown) break;
        var vis = ln.substring(0, Math.max(0, shown - used));
        Gfx.text(vis, VW / 2, 92 + i * 18, { size: 11, align: 'center', color: PAL.bone });
        used += ln.length + 1;
      }
      if (Math.floor(this.t * 2) % 2 === 0) {
        Gfx.text('PRESS ENTER', VW / 2, VH - 30, { size: 10, align: 'center', color: PAL.hart });
      }
    },

    drawPause: function () {
      Gfx.rectA(0, 0, VW, VH, '#000', 0.72);
      Gfx.text('PAUSED', VW / 2, 100, { size: 28, align: 'center', color: PAL.hart, glow: PAL.hart });
      Gfx.text('ENTER — RESUME     TAB — CODEX     M — SOUND', VW / 2, 150,
        { size: 10, align: 'center', color: PAL.bone });
      Gfx.text('SCORE ' + this.score + '     SHARDS ' + this.shardsFound + '/' + this.shardsTotal,
        VW / 2, 176, { size: 9, align: 'center', color: PAL.gold });
    },

    drawClear: function () {
      Gfx.rectA(0, 0, VW, VH, '#000', 0.75);
      var lv = RA.LEVELS[this.level];
      Gfx.text(lv.name + ' CLEAR', VW / 2, 96, { size: 26, align: 'center', color: PAL.gold, glow: PAL.gold });
      Gfx.text(lv.place, VW / 2, 130, { size: 10, align: 'center', color: PAL.bone });
      Gfx.text('SCORE  ' + String(this.score).padStart(7, '0'), VW / 2, 164,
        { size: 12, align: 'center', color: PAL.white });
      Gfx.text('SHARDS ' + this.shardsFound + '/' + this.shardsTotal, VW / 2, 186,
        { size: 10, align: 'center', color: PAL.amber });
      if (this.clearT > 1.6 && Math.floor(this.t * 2) % 2 === 0) {
        Gfx.text('PRESS ENTER', VW / 2, 228, { size: 11, align: 'center', color: PAL.hart });
      }
    },

    drawGameOver: function () {
      Gfx.rectA(0, 0, VW, VH, '#12010a', 0.85);
      Gfx.text('GAME OVER', VW / 2, 86, { size: 34, align: 'center', color: PAL.raRed, glow: PAL.raRed });
      Gfx.text('RA.ONE DOES NOT ACCEPT AN UNFINISHED TURN', VW / 2, 130,
        { size: 9, align: 'center', color: PAL.bone });
      if (this.contT > 0) {
        Gfx.text('CONTINUE?', VW / 2, 168, { size: 18, align: 'center', color: PAL.white });
        Gfx.text(Math.max(0, Math.ceil(this.contT)).toString(), VW / 2, 196,
          { size: 26, align: 'center', color: PAL.amber, glow: PAL.amber });
        Gfx.text('PRESS ENTER', VW / 2, 232, { size: 10, align: 'center', color: PAL.hart });
      } else {
        Gfx.text('SCORE ' + String(this.score).padStart(7, '0'), VW / 2, 180,
          { size: 12, align: 'center', color: PAL.gold });
      }
    },

    drawEnding: function () {
      Gfx.rect(0, 0, VW, VH, '#03040a');
      var t = this.stateT;
      // the H.A.R.T., left behind on an empty floor
      var pulse = 0.6 + 0.4 * Math.sin(t * 2.2);
      Gfx.rectA(0, VH - 90, VW, 90, '#080d18', 1);
      Gfx.rectA(0, VH - 90, VW, 1, PAL.steel, 0.6);
      var hx = VW / 2, hy = VH - 120;
      Gfx.glow(hx, hy, 40 + pulse * 22, PAL.hart, 0.55);
      Gfx.rect(hx - 3, hy - 10, 6, 20, PAL.hart);
      Gfx.rect(hx - 10, hy - 3, 20, 6, PAL.hart);
      Gfx.rect(hx - 4, hy - 4, 8, 8, PAL.hartGlow);
      Gfx.ring(hx, hy, 26 + pulse * 8, PAL.hart, 1, 0.45);
      for (var i = 0; i < 10; i++) {
        var a = t * 0.8 + i * 0.63, r = 40 + Math.sin(t + i) * 14;
        Gfx.rectA(hx + Math.cos(a) * r, hy + Math.sin(a) * r * 0.5, 2, 2, PAL.hartGlow, 0.6);
      }
      Gfx.text('THE BODY GOES BACK TO THE VIRTUAL WORLD.', VW / 2, 60,
        { size: 11, align: 'center', color: PAL.bone, alpha: C.clamp(t - 0.4, 0, 1) });
      Gfx.text('THE H.A.R.T. STAYS BEHIND.', VW / 2, 82,
        { size: 11, align: 'center', color: PAL.hart, glow: PAL.hart, alpha: C.clamp(t - 1.4, 0, 1) });
      if (t > 2.5 && Math.floor(this.t * 2) % 2 === 0) {
        Gfx.text('PRESS ENTER', VW / 2, VH - 34, { size: 10, align: 'center', color: PAL.white });
      }
    },

    drawCredits: function () {
      Gfx.rect(0, 0, VW, VH, '#03040a');
      hud.Back.grid({ x: this.t * 20, y: 0 }, this.t * 0.5, this);
      Gfx.rectA(0, 0, VW, VH, '#02030a', 0.7);
      this.logo(VW / 2, 26, false);
      var rows = [
        ['FINAL SCORE', String(this.score)],
        ['HI-SCORE', String(this.hi)],
        ['DATA SHARDS', this.shardsFound + ' / ' + this.shardsTotal],
        ['DIFFICULTY', this.difficulty ? 'LUCIFER' : 'NORMAL']
      ];
      for (var i = 0; i < rows.length; i++) {
        Gfx.text(rows[i][0], VW / 2 - 130, 120 + i * 20, { size: 10, color: PAL.steelLite });
        Gfx.text(rows[i][1], VW / 2 + 130, 120 + i * 20, { size: 10, align: 'right', color: PAL.gold });
      }
      Gfx.text('INSPIRED BY RA.ONE (2011) — DIR. ANUBHAV SINHA', VW / 2, VH - 60,
        { size: 8, align: 'center', color: PAL.bone });
      Gfx.text('UNOFFICIAL FAN TRIBUTE. NOT AFFILIATED WITH THE RIGHTS HOLDERS.', VW / 2, VH - 44,
        { size: 7, align: 'center', color: PAL.steel });
      if (Math.floor(this.t * 2) % 2 === 0) {
        Gfx.text('PRESS ENTER', VW / 2, VH - 22, { size: 9, align: 'center', color: PAL.hart });
      }
    }
  };

  global.RA.Game = Game;
  global.addEventListener('load', function () {
    Game.init(document.getElementById('screen'));
  });
})(window);

</script>
